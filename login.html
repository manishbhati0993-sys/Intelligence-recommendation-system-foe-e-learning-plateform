<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduPulse AI — Sign In / Register (EduRecommend)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-950: #020817;
      --bg-900: #0f172a;
      --bg-800: #1e293b;
      --slate-400: #94a3b8;
      --slate-300: #cbd5e1;
      --slate-100: #f1f5f9;
      --indigo-600: #4f46e5;
      --indigo-500: #6366f1;
      --indigo-400: #818cf8;
      --emerald-400: #34d399;
      --cyan-400: #22d3ee;
      --rose-500: #f43f5e;
      --amber-400: #fbbf24;
      --font: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #020817 65%);
      color: var(--slate-100);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background glow */
    .glow-orb {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, rgba(34,211,238,0.06) 40%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-left { top: -100px; left: -100px; }
    .orb-right { bottom: -120px; right: -100px; }

    .auth-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 28px;
      padding: 36px 32px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(79, 70, 229, 0.15);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      background: linear-gradient(135deg, var(--indigo-600), var(--cyan-400));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, var(--indigo-400));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-sub {
      font-size: 12px;
      color: var(--slate-400);
      margin-top: 4px;
    }

    /* Backend Connection Status Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 99px;
      margin-top: 10px;
      background: rgba(2, 8, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--slate-400);
      transition: all 0.2s;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--slate-400);
    }
    .status-badge.online {
      color: var(--emerald-400);
      border-color: rgba(52, 211, 153, 0.3);
      background: rgba(16, 185, 129, 0.1);
    }
    .status-badge.online .status-dot {
      background: var(--emerald-400);
      box-shadow: 0 0 8px var(--emerald-400);
    }
    .status-badge.offline {
      color: var(--amber-400);
      border-color: rgba(251, 191, 36, 0.3);
      background: rgba(251, 191, 36, 0.1);
    }
    .status-badge.offline .status-dot {
      background: var(--amber-400);
    }

    /* Tabs */
    .tab-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(2, 8, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 24px;
    }
    .tab-btn {
      padding: 9px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      background: none;
      color: var(--slate-400);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--indigo-600);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
    }

    /* Forms */
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--slate-300);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      background: rgba(2, 8, 23, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--slate-100);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    .form-input:focus {
      border-color: var(--indigo-500);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    .form-input::placeholder {
      color: #64748b;
    }

    /* Primary Submit Button */
    .btn-submit {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--indigo-600), #6366f1);
      color: #ffffff;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35);
      margin-top: 8px;
    }
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(79, 70, 229, 0.45);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Demo Account Button */
    .btn-demo {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px dashed rgba(99, 102, 241, 0.35);
      color: var(--indigo-300);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-demo:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--indigo-400);
      color: #ffffff;
    }

    /* Notification / Error Alert */
    .alert-box {
      display: none;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .alert-error {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
    }
    .alert-success {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: var(--slate-400);
    }
    .auth-footer a {
      color: var(--indigo-400);
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="glow-orb orb-left"></div>
  <div class="glow-orb orb-right"></div>

  <div class="auth-container">
    <div class="brand-header">
      <div class="brand-icon">🧠</div>
      <h1 class="brand-title">EduPulse<span style="color:var(--indigo-400)">.AI</span></h1>
      <p class="brand-sub">Intelligent Recommendation System for E-Learning Platform</p>
      <div id="status-badge" class="status-badge">
        <span class="status-dot"></span>
        <span id="status-text">Checking backend on port 8000...</span>
      </div>
    </div>

    <!-- Tab Selector -->
    <div class="tab-nav">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- Alert Message Box -->
    <div id="alert-box" class="alert-box"></div>

    <!-- Sign In Form -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <input
          class="form-input"
          type="email"
          id="login-email"
          required
          placeholder="name@example.com"
          value="manish@example.com"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <input
          class="form-input"
          type="password"
          id="login-password"
          required
          placeholder="••••••••"
          value="Demo@12345"
        />
      </div>

      <button type="submit" class="btn-submit" id="login-btn">
        Sign In to Portal
      </button>

      <button type="button" class="btn-demo" onclick="fillDemoCredentials()">
        ⚡ One-Click Demo Login (manish@example.com)
      </button>
    </form>

    <!-- Register Form -->
    <form id="register-form" style="display:none;" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label" for="reg-name">Full Name</label>
        <input
          class="form-input"
          type="text"
          id="reg-name"
          required
          placeholder="Alex Morgan"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Email Address</label>
        <input
          class="form-input"
          type="email"
          id="reg-email"
          required
          placeholder="alex@stanford.edu"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-password">Password (8+ chars)</label>
        <input
          class="form-input"
          type="password"
          id="reg-password"
          required
          placeholder="Create a strong password"
          minlength="8"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-role">Target Career Track</label>
        <select class="form-input" id="reg-role">
          <option value="AI / Machine Learning Engineer">AI / Machine Learning Engineer</option>
          <option value="Become a Data Scientist">Become a Data Scientist</option>
          <option value="Cloud & MLOps Architect">Cloud & MLOps Architect</option>
          <option value="Full Stack AI Engineer">Full Stack AI Engineer</option>
          <option value="Data Platform Engineer">Data Platform Engineer</option>
        </select>
      </div>

      <button type="submit" class="btn-submit" id="reg-btn">
        Create AI Learner Account
      </button>
    </form>

    <div class="auth-footer">
      <span>Group 03 · Intelligent Recommendation Engine</span><br />
      <span style="font-size:10px;color:#64748b;">FastAPI Hybrid Recommender · PostgreSQL · JWT</span>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    // Tab switching
    function switchTab(mode) {
      const loginForm = document.getElementById('login-form');
      const regForm = document.getElementById('register-form');
      const tabLogin = document.getElementById('tab-login');
      const tabReg = document.getElementById('tab-register');
      clearAlert();

      if (mode === 'login') {
        loginForm.style.display = 'block';
        regForm.style.display = 'none';
        tabLogin.classList.add('active');
        tabReg.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        regForm.style.display = 'block';
        tabLogin.classList.remove('active');
        tabReg.classList.add('active');
      }
    }

    function showAlert(msg, isError = true) {
      const alert = document.getElementById('alert-box');
      alert.style.display = 'block';
      alert.className = isError ? 'alert-box alert-error' : 'alert-box alert-success';
      alert.textContent = msg;
    }

    function clearAlert() {
      const alert = document.getElementById('alert-box');
      alert.style.display = 'none';
    }

    function fillDemoCredentials() {
      document.getElementById('login-email').value = 'manish@example.com';
      document.getElementById('login-password').value = 'Demo@12345';
      clearAlert();
    }

    // Health check check on load
    async function checkBackend() {
      const badge = document.getElementById('status-badge');
      const text = document.getElementById('status-text');
      try {
        const health = await EduApi.checkHealth();
        if (health && health.status === 'ok') {
          badge.className = 'status-badge online';
          text.textContent = 'Backend Online (FastAPI :8000)';
        } else {
          badge.className = 'status-badge offline';
          text.textContent = 'Backend Offline (FastAPI not responding)';
        }
      } catch (err) {
        badge.className = 'status-badge offline';
        text.textContent = 'Backend Offline (Start with uvicorn app.main:app)';
      }
    }

    // Check existing session
    async function checkExistingSession() {
      try {
        const user = await EduApi.restoreSession();
        if (user) {
          showAlert(`Welcome back, ${user.name}! Redirecting...`, false);
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 600);
        }
      } catch (e) {
        // No session, stay on login
      }
    }

    // Login handler
    async function handleLogin(e) {
      e.preventDefault();
      clearAlert();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.textContent = 'Verifying credentials...';

      try {
        const res = await EduApi.login(email, password);
        showAlert(`Signed in as ${res.user?.name || email}! Launching portal...`, false);
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
      } catch (err) {
        showAlert(err.message || 'Login failed. Please check your credentials or start the backend.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In to Portal';
      }
    }

    // Registration handler
    async function handleRegister(e) {
      e.preventDefault();
      clearAlert();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const targetCareer = document.getElementById('reg-role').value;
      const btn = document.getElementById('reg-btn');

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const res = await EduApi.register({
          name,
          email,
          password,
          target_career: targetCareer,
          program: targetCareer,
          level: 'Intermediate',
          interests: ['AI', 'Data Science', 'Machine Learning'],
        });
        showAlert(`Account created for ${name}! Entering portal...`, false);
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
      } catch (err) {
        showAlert(err.message || 'Registration failed.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create AI Learner Account';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      checkBackend();
      checkExistingSession();
    });
  </script>
</body>
</html>
